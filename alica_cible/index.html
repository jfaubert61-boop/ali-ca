<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ali_cible</title>
  </head>
  <body>
    <h1>ali_cible</h1>
    <label for="json-file">Importer ali_cible.json</label>
    <input id="json-file" type="file" accept=".json,application/json">
    <p id="status" role="status" aria-live="polite"></p>
    <pre id="json-content"></pre>

    <script>
      const fileInput = document.getElementById('json-file');
      const status = document.getElementById('status');
      const content = document.getElementById('json-content');

      fileInput.addEventListener('change', async () => {
        const file = fileInput.files[0];
        if (!file) return;

        status.textContent = '';
        content.textContent = '';
        try {
          const data = JSON.parse(await file.text());
          content.textContent = JSON.stringify(data, null, 2);
          status.textContent = `Fichier ${file.name} importé.`;
        } catch (error) {
          status.textContent = `Impossible d’importer ${file.name} : ${error.message}`;
        }
      });
    </script>
  </body>
</html>
