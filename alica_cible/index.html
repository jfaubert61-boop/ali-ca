<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ali_cible</title>
    <style>
      table {
        width: min(100%, 632px);
        table-layout: fixed;
        border-collapse: collapse;
        text-align: center;
      }

      caption {
        border: 1px solid #ddd;
        border-bottom: 0;
        font: 16px Arial, sans-serif;
        padding: 2px;
      }

      th, td {
        border: 1px solid black;
        padding: 2px;
        font-size: clamp(14px, 3.5vw, 23px);
      }

      #target-values tbody tr:last-child td {
        font: 16px Arial, sans-serif;
      }

      .import-control {
        position: relative;
        display: inline-block;
        padding: 2px 6px;
        border: 1px solid #767676;
        border-radius: 2px;
        background: #efefef;
        color: #111;
        font: 13.3333px Arial, sans-serif;
        cursor: pointer;
      }

      .import-control:focus-within {
        outline: 2px solid #005fcc;
        outline-offset: 2px;
      }

      .import-control input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>ali_cible</h1>
    <label class="import-control">
      Importer ali_cible.json
      <input id="json-file" type="file" accept=".json,application/json">
    </label>
    <label class="import-control">
      Importer un JSON d’aliments
      <input id="meal-json-file" type="file" accept=".json,application/json">
    </label>
    <p id="status" role="status" aria-live="polite"></p>
    <table id="target-values" hidden>
      <caption>Valeurs cibles</caption>
      <thead>
        <tr><th scope="col">Kcal</th><th scope="col">Glucides (g)</th><th scope="col">Lipides (g)</th><th scope="col">Protéines (g)</th></tr>
      </thead>
      <tbody>
        <tr><td></td><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td><td></td></tr>
      </tbody>
    </table>
    <p id="meal-status" role="status" aria-live="polite"></p>
    <table id="meal-totals" hidden>
      <caption>Somme des aliments importés</caption>
      <thead>
        <tr><th scope="col">Kcal</th><th scope="col">Glucides (g)</th><th scope="col">Lipides (g)</th><th scope="col">Protéines (g)</th></tr>
      </thead>
      <tbody>
        <tr><td id="total-calories"></td><td id="total-glucide"></td><td id="total-lipide"></td><td id="total-proteine"></td></tr>
      </tbody>
    </table>

    <script>
      const fileInput = document.getElementById('json-file');
      const status = document.getElementById('status');
      const targetValues = document.getElementById('target-values');
      const targetCells = targetValues.querySelectorAll('tbody td');
      const targetFields = ['Kcal', 'Glu', 'Lip g', 'Prot p', null, 'Glu %', 'Lip %', 'Prot %'];
      const mealFileInput = document.getElementById('meal-json-file');
      const mealStatus = document.getElementById('meal-status');
      const mealTotals = document.getElementById('meal-totals');
      const nutrients = ['calories', 'glucide', 'lipide', 'proteine'];
      const numberFormat = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 6 });

      function readFileAsText(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            if (typeof reader.result === 'string') {
              resolve(reader.result);
            } else {
              reject(new Error('Lecture du fichier impossible.'));
            }
          };
          reader.onerror = () => reject(reader.error || new Error('Lecture du fichier impossible.'));
          reader.onabort = () => reject(new Error('Lecture du fichier interrompue.'));
          reader.readAsText(file);
        });
      }

      fileInput.addEventListener('change', async () => {
        const file = fileInput.files[0];
        if (!file) return;

        status.textContent = '';
        targetValues.hidden = true;
        targetCells.forEach(cell => { cell.textContent = ''; });
        try {
          const data = JSON.parse((await readFileAsText(file)).replace(/^\uFEFF/, ''));
          if (!Array.isArray(data?.cible) || data.cible.length !== 1 || data.cible[0] === null || typeof data.cible[0] !== 'object' || Array.isArray(data.cible[0])) {
            throw new Error('Le fichier doit contenir une seule cible dans la liste « cible ».');
          }
          const target = data.cible[0];
          targetFields.forEach(field => {
            if (field === null) return;
            const value = target[field];
            if (!Object.prototype.hasOwnProperty.call(target, field) || (typeof value !== 'number' && (typeof value !== 'string' || value.trim() === ''))) {
              throw new Error(`Valeur « ${field} » manquante ou invalide.`);
            }
          });
          targetFields.forEach((field, index) => {
            if (field === null) return;
            const value = String(target[field]).trim();
            targetCells[index].textContent = field.endsWith(' %') && !value.endsWith('%') ? `${value}%` : value;
          });
          targetValues.hidden = false;
          status.textContent = `Fichier ${file.name} importé.`;
        } catch (error) {
          status.textContent = `Impossible d’importer ${file.name} : ${error.message}`;
        } finally {
          fileInput.value = '';
        }
      });

      mealFileInput.addEventListener('change', async () => {
        const file = mealFileInput.files[0];
        if (!file) return;

        mealStatus.textContent = '';
        mealTotals.hidden = true;
        try {
          const data = JSON.parse((await readFileAsText(file)).replace(/^\uFEFF/, ''));
          let meals;
          if (Array.isArray(data)) {
            meals = data;
          } else if (Array.isArray(data?.repas)) {
            meals = data.repas;
          } else if (data?.repasParJour && typeof data.repasParJour === 'object' && !Array.isArray(data.repasParJour)) {
            meals = Object.values(data.repasParJour).flatMap(day => {
              if (Array.isArray(day)) return day;
              if (Array.isArray(day?.repas)) return day.repas;
              throw new Error('Format de repas par jour invalide.');
            });
          } else {
            throw new Error('Le fichier doit contenir une liste d’aliments ou de repas.');
          }

          const totals = Object.fromEntries(nutrients.map(nutrient => [nutrient, 0]));
          meals.forEach((meal, index) => {
            nutrients.forEach(nutrient => {
              const value = meal?.[nutrient];
              if ((typeof value !== 'number' && (typeof value !== 'string' || value.trim() === '')) || !Number.isFinite(Number(value))) {
                throw new Error(`Valeur ${nutrient} invalide pour l’aliment ${index + 1}.`);
              }
              totals[nutrient] += Number(value);
              if (!Number.isFinite(totals[nutrient])) throw new Error(`Total ${nutrient} trop grand.`);
            });
          });
          nutrients.forEach(nutrient => {
            document.getElementById(`total-${nutrient}`).textContent = numberFormat.format(totals[nutrient]);
          });
          mealTotals.hidden = false;
          mealStatus.textContent = `Fichier ${file.name} importé : ${meals.length} aliment(s).`;
        } catch (error) {
          mealStatus.textContent = `Impossible d’importer ${file.name} : ${error.message}`;
        } finally {
          mealFileInput.value = '';
        }
      });
    </script>
  </body>
</html>
