<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ali_cible</title>
  </head>
  <body>
    <h1>ali_cible</h1>
    <button id="import-button" type="button">Importer ali_cible.json</button>
    <input id="json-file" type="file" accept=".json,application/json" hidden>
    <button id="meal-import-button" type="button">Importer un JSON d’aliments</button>
    <input id="meal-json-file" type="file" accept=".json,application/json" hidden>
    <p id="status" role="status" aria-live="polite"></p>
    <table id="target-values" hidden>
      <caption>Valeurs cibles importées</caption>
      <thead>
        <tr><th scope="col">Cible</th><th scope="col">Valeur</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="meal-status" role="status" aria-live="polite"></p>
    <table id="meal-totals" hidden>
      <caption>Somme des aliments importés</caption>
      <thead>
        <tr><th scope="col">Kcal</th><th scope="col">Glucides (g)</th><th scope="col">Lipides (g)</th><th scope="col">Protéines (g)</th></tr>
      </thead>
      <tbody>
        <tr><td id="total-calories"></td><td id="total-glucide"></td><td id="total-lipide"></td><td id="total-proteine"></td></tr>
      </tbody>
    </table>

    <script>
      const fileInput = document.getElementById('json-file');
      const status = document.getElementById('status');
      const targetValues = document.getElementById('target-values');
      const targetValuesBody = targetValues.querySelector('tbody');
      const mealFileInput = document.getElementById('meal-json-file');
      const mealStatus = document.getElementById('meal-status');
      const mealTotals = document.getElementById('meal-totals');
      const nutrients = ['calories', 'glucide', 'lipide', 'proteine'];
      const numberFormat = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 6 });

      document.getElementById('import-button').addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', async () => {
        const file = fileInput.files[0];
        if (!file) return;

        status.textContent = '';
        targetValues.hidden = true;
        targetValuesBody.replaceChildren();
        try {
          const data = JSON.parse((await file.text()).replace(/^\uFEFF/, ''));
          if (data === null || typeof data !== 'object') {
            throw new Error('Le fichier doit contenir un objet ou une liste de valeurs cibles.');
          }

          function addValues(value, path) {
            if (value !== null && typeof value === 'object' && Object.keys(value).length > 0) {
              Object.entries(value).forEach(([key, child]) => {
                addValues(child, path ? `${path} / ${key}` : key);
              });
              return;
            }
            const row = document.createElement('tr');
            const label = document.createElement('th');
            const cell = document.createElement('td');
            label.scope = 'row';
            label.textContent = path || 'Valeurs cibles';
            cell.textContent = typeof value === 'object' ? JSON.stringify(value) : String(value);
            row.append(label, cell);
            targetValuesBody.append(row);
          }

          addValues(data, '');
          targetValues.hidden = false;
          status.textContent = `Fichier ${file.name} importé.`;
        } catch (error) {
          targetValuesBody.replaceChildren();
          status.textContent = `Impossible d’importer ${file.name} : ${error.message}`;
        } finally {
          fileInput.value = '';
        }
      });

      document.getElementById('meal-import-button').addEventListener('click', () => mealFileInput.click());
      mealFileInput.addEventListener('change', async () => {
        const file = mealFileInput.files[0];
        if (!file) return;

        mealStatus.textContent = '';
        mealTotals.hidden = true;
        try {
          const data = JSON.parse((await file.text()).replace(/^\uFEFF/, ''));
          let meals;
          if (Array.isArray(data)) {
            meals = data;
          } else if (Array.isArray(data?.repas)) {
            meals = data.repas;
          } else if (data?.repasParJour && typeof data.repasParJour === 'object' && !Array.isArray(data.repasParJour)) {
            meals = Object.values(data.repasParJour).flatMap(day => {
              if (Array.isArray(day)) return day;
              if (Array.isArray(day?.repas)) return day.repas;
              throw new Error('Format de repas par jour invalide.');
            });
          } else {
            throw new Error('Le fichier doit contenir une liste d’aliments ou de repas.');
          }

          const totals = Object.fromEntries(nutrients.map(nutrient => [nutrient, 0]));
          meals.forEach((meal, index) => {
            nutrients.forEach(nutrient => {
              const value = meal?.[nutrient];
              if ((typeof value !== 'number' && (typeof value !== 'string' || value.trim() === '')) || !Number.isFinite(Number(value))) {
                throw new Error(`Valeur ${nutrient} invalide pour l’aliment ${index + 1}.`);
              }
              totals[nutrient] += Number(value);
              if (!Number.isFinite(totals[nutrient])) throw new Error(`Total ${nutrient} trop grand.`);
            });
          });
          nutrients.forEach(nutrient => {
            document.getElementById(`total-${nutrient}`).textContent = numberFormat.format(totals[nutrient]);
          });
          mealTotals.hidden = false;
          mealStatus.textContent = `Fichier ${file.name} importé : ${meals.length} aliment(s).`;
        } catch (error) {
          mealStatus.textContent = `Impossible d’importer ${file.name} : ${error.message}`;
        } finally {
          mealFileInput.value = '';
        }
      });
    </script>
  </body>
</html>
