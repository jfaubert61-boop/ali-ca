let repas = [];
let alimentSelectionne = null;

const listeAliments =
document.getElementById("listeAliments");




function afficherAliments(filtre=""){

    listeAliments.innerHTML="";

    const resultat =
    aliments.filter(aliment=>

        aliment.nom
        .toLowerCase()
        .includes(
            filtre.toLowerCase()
        )

    );

    resultat.forEach(aliment=>{

        const div =
        document.createElement("div");

        div.className = "aliment";

        div.innerHTML =

        "<strong>" +
        aliment.nom +
        "</strong><br aria-hidden=\"true\">" +

        aliment.categorie +

        " • " +

        aliment.calories_100g +

        " kcal /100g";

        div.onclick = ()=>{

            document
            .querySelectorAll(".aliment")
            .forEach(el=>
                el.classList.remove(
                    "aliment-selectionne"
                )
            );

            div.classList.add(
                "aliment-selectionne"
            );

            alimentSelectionne =
            aliment;

            document
            .getElementById("selection")
            .innerHTML =

            "Sélection : " +
            aliment.nom;

            document
            .getElementById("quantite")
            .value =
            aliment.portion_defaut || 100;

        };

        listeAliments
        .appendChild(div);

    });

}

document
.getElementById("recherche")
.addEventListener("input", function(){

    afficherAliments(this.value);

});

function ajouterAuRepas(){

    if(!alimentSelectionne){
        alert("Sélectionnez un aliment.");
        return;
    }

    let nom = alimentSelectionne.nom;

    let quantite = parseFloat(
        document.getElementById("quantite").value
    );

    let calories100g =
        alimentSelectionne.calories_100g;

    if(nom === "autreAliment"){

        const nouveauNom = prompt(
            "Nom de l'aliment :",
            ""
        );

        if(!nouveauNom){
            return;
        }

        nom = nouveauNom.trim();

        const nouveauxGrammes = prompt(
            "Quantité (g) :",
            quantite
        );

        if(
            nouveauxGrammes === null ||
            isNaN(nouveauxGrammes)
        ){
            return;
        }

        quantite = parseFloat(nouveauxGrammes);

        const nouvellesKcal = prompt(
            "Calories pour 100 g :",
            calories100g
        );

        if(
            nouvellesKcal === null ||
            isNaN(nouvellesKcal)
        ){
            return;
        }

        calories100g =
            parseFloat(nouvellesKcal);
    }

    const calories =
        (quantite * calories100g) / 100;

    repas.push({
        nom: nom,
        quantite: quantite,
        calories: calories
    });

    afficherRepas();
}


function afficherRepas(){

    const zone =
    document.getElementById("repas");

    zone.innerHTML = "";

    let total = 0;

    repas.forEach((item,index)=>{

        total += item.calories;

        const ligne =
        document.createElement("div");

        ligne.className =
        "ligneRepas";

        ligne.innerHTML =

        `
        <div>
        <strong>${item.nom}</strong><br>
        ${item.quantite} g
        - ${item.calories.toFixed(0)} kcal
        </div>

        <button
        class="btnSupprimer"
        onclick="supprimer(${index})">
        ✕
        </button>
        `;

        zone.appendChild(ligne);

    });

    document
    .getElementById("total")
    .innerHTML =

    total.toFixed(0)
    + " kcal";

}

function supprimer(index){

    repas.splice(index,1);

    afficherRepas();

}

function exporterRepasJSON(){

    const donnees = {

        date:
        new Date().toLocaleString(),

        total:
        repas.reduce(
            (s,item)=>
            s + item.calories,
            0
        ),

        repas: repas

    };

    const blob =
    new Blob(
        [
            JSON.stringify(
                donnees,
                null,
                2
            )
        ],
        {
            type:
            "application/json"
        }
    );

    const lien =
    document.createElement("a");

    lien.href =
    URL.createObjectURL(blob);

    const date =
    new Date()
    .toISOString()
    .slice(0,10);

    lien.download =
    "Repas_" +
    date +
    ".json";

    lien.click();

    URL.revokeObjectURL(
        lien.href
    );
}



function importerRepasJSON(event){

    const fichier =
    event.target.files[0];

    if(!fichier){
        return;
    }

    const lecteur =
    new FileReader();

    lecteur.onload =
    function(e){

        try{

            const data =
            JSON.parse(
                e.target.result
            );

            if(
                Array.isArray(
                    data.repas
                )
            ){

                repas =
                data.repas;

                afficherRepas();

                alert(
                "Repas importé avec succès."
                );

            }
            else{

                alert(
                "Format JSON invalide."
                );

            }

        }
        catch(err){

            alert(
            "Erreur de lecture du fichier JSON."
            );

        }

    };

    lecteur.readAsText(
        fichier
    );

}
