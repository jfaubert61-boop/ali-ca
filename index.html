function chargerAlimentsPerso(){
    try {
        if (typeof localStorage === "undefined") {
            return [];
        }
        const raw = localStorage.getItem(CUSTOM_FOODS_KEY);
        if (!raw) return [];
        const data = JSON.parse(raw);
        return Array.isArray(data) ? data : [];
    } catch (err) {
        console.warn("Impossible de charger les aliments personnalisés", err);
        return [];
    }
}

function sauvegarderAlimentsPerso(){
    try {
        if (typeof localStorage === "undefined") return;
        const personnalises = aliments.filter(aliment =>
            aliment.categorie === "Personnalisé" || aliment.categorie === "Aliment personnalisé"
        );
        localStorage.setItem(CUSTOM_FOODS_KEY, JSON.stringify(personnalises));
    } catch (err) {
        console.warn("Impossible de sauvegarder les aliments personnalisés", err);
    }
}

function ajouterAlimentPerso(){
    const nomInput = document.getElementById("nomAlimentPerso");
    const categorieInput = document.getElementById("categorieAlimentPerso");
    const kcalInput = document.getElementById("kcalPerso");

    const nom = (nomInput.value || "").trim();
    const categorie = (categorieInput.value || "Personnalisé").trim() || "Personnalisé";
    const kcal = Number(kcalInput.value);

    if (!nom) {
        alert("Saisis le nom de l'aliment.");
        return;
    }

    if (!Number.isFinite(kcal) || kcal < 0) {
        alert("Saisis une valeur de kcal valide (> 0).\n");
        return;
    }

    const nouvelAliment = {
        id: Date.now(),
        nom,
        categorie,
        portion_defaut: 100,
        unite: "g",
        calories_100g: kcal
    };

    aliments.push(nouvelAliment);
    sauvegarderAlimentsPerso();

    alimentSelectionne = nouvelAliment;
    document.getElementById("selection").innerHTML = "Sélection : " + nom;
    document.getElementById("quantite").value = 100;
    nomInput.value = "";
    categorieInput.value = "";
    kcalInput.value = "";

    document.getElementById("recherche").value = "";
    afficherAliments();
}

aliments = aliments.concat(chargerAlimentsPerso());

function formaterDate(dateStr){
    const date = new Date(dateStr + "T00:00:00");
    return date.toLocaleDateString("fr-FR", {
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric"
    });
}

function normaliserHistorique(data){
    if (Array.isArray(data)) {
        return {
            [dateSelectionnee]: {
                repas: data,
                total: data.reduce((s, item) => s + (Number(item.calories) || 0), 0)
            }
        };
    }

    if (data && typeof data === "object") {
        const jours = {};
        Object.entries(data).forEach(([date, valeur]) => {
            const repas = Array.isArray(valeur?.repas) ? valeur.repas : (Array.isArray(valeur) ? valeur : []);
            const poidsKg = Number(valeur?.poidsKg);
            jours[date] = {
                repas,
                total: repas.reduce((s, item) => s + (Number(item.calories) || 0), 0),
                poidsKg: valeur?.poidsKg !== null && valeur?.poidsKg !== "" && Number.isFinite(poidsKg) && poidsKg >= 0 && poidsKg <= 999.9
                    ? poidsKg
                    : null
            };
        });
        return jours;
    }

    return {};
}

function readCookieValue(key) {
    const match = document.cookie.match(new RegExp("(?:^|; )" + key + "=([^;]*)"));
    return match ? decodeURIComponent(match[1]) : null;
}

function writeCookieValue(key, value) {
    try {
        document.cookie = `${key}=${encodeURIComponent(value)}; path=/; max-age=${60 * 60 * 24 * 365}; SameSite=Lax`;
        return true;
    } catch (err) {
        console.warn("Cookie de secours indisponible", err);
        return false;
    }
}

function sauvegarderRepas(){
    const payload = JSON.stringify(historiqueRepas);

    try {
        if (typeof localStorage !== "undefined") {
            localStorage.setItem(STORAGE_KEY, payload);
            return true;
        }
    } catch (err) {
        console.warn("localStorage indisponible, fallback sur sessionStorage/cookie", err);
    }

    try {
        if (typeof sessionStorage !== "undefined") {
            sessionStorage.setItem(STORAGE_KEY, payload);
            return true;
        }
    } catch (err) {
        console.warn("sessionStorage indisponible, fallback sur cookie", err);
    }

    try {
        writeCookieValue(STORAGE_KEY, payload);
        return true;
    } catch (err) {
        console.warn("Sauvegarde impossible dans les stockages standards", err);
    }

    window.__aliCaFallbackStorage = payload;
    return true;
}

function chargerRepas(){
    const sources = [];

    if (typeof localStorage !== "undefined") {
        sources.push(() => localStorage.getItem(STORAGE_KEY));
    }
    if (typeof sessionStorage !== "undefined") {
        sources.push(() => sessionStorage.getItem(STORAGE_KEY));
    }
    sources.push(() => readCookieValue(STORAGE_KEY));
    sources.push(() => (window.__aliCaFallbackStorage || null));

    for (const lire of sources) {
        try {
            const raw = lire();
            if (!raw) continue;
            const donnees = JSON.parse(raw);
            historiqueRepas = normaliserHistorique(donnees);
            if (!historiqueRepas[dateSelectionnee]) {
                historiqueRepas[dateSelectionnee] = { repas: [], total: 0 };
            }
            return;
        } catch (err) {
            console.warn("Lecture de sauvegarde impossible, tentative suivante", err);
        }
    }

    historiqueRepas = {};
    historiqueRepas[dateSelectionnee] = { repas: [], total: 0 };
}

function getRepasDuJour(){
    const jour = historiqueRepas[dateSelectionnee] || { repas: [] };
    return Array.isArray(jour.repas) ? jour.repas : [];
}

function setRepasDuJour(nouvelleListe){
    const poidsKg = historiqueRepas[dateSelectionnee]?.poidsKg ?? null;
    historiqueRepas[dateSelectionnee] = {
        repas: nouvelleListe,
        total: nouvelleListe.reduce((s, item) => s + (Number(item.calories) || 0), 0),
        poidsKg
    };
    sauvegarderRepas();
}

function getHistoriqueTrie(){
    return Object.entries(historiqueRepas).sort(([a], [b]) => b.localeCompare(a));
}

function escapeCSV(valeur){
    const chaine = String(valeur ?? "");
    return `"${chaine.replace(/"/g, '""')}"`;
}

function getCsvContent(){
    const lignes = [["date", "aliment", "quantite_g", "calories_kcal", "poids_kg"]];

    getHistoriqueTrie().forEach(([dateJour, data]) => {
        const repas = Array.isArray(data?.repas) ? data.repas : [];
        const poidsKg = data?.poidsKg == null ? "" : Number(data.poidsKg).toFixed(1);
        if (repas.length === 0 && poidsKg !== "") {
            lignes.push([dateJour, "", "", "", poidsKg]);
        }
        repas.forEach((item) => {
            lignes.push([
                dateJour,
                item.nom,
                Number(item.quantite) || 0,
                Number(item.calories) || 0,
                poidsKg
            ]);
        });
    });

    return lignes
        .map(ligne => ligne.map(escapeCSV).join(","))
        .join("\n");
}

async function sauvegarderCSV(){
    const csvContent = getCsvContent();
    const nomFichier = "historique_repas.csv";

    if (window.showDirectoryPicker) {
        try {
            const dossier = await window.showDirectoryPicker({ mode: "readwrite" });
            const fichierHandle = await dossier.getFileHandle(nomFichier, { create: true });
            const flux = await fichierHandle.createWritable();
            await flux.write(csvContent);
            await flux.close();
            alert("Fichier CSV enregistré dans le dossier choisi.");
            return;
        }
        catch (erreur) {
            if (erreur && erreur.name !== "AbortError") {
                console.warn("Dossier non sélectionné, fallback sur téléchargement.", erreur);
            }
        }
    }

    if (window.showSaveFilePicker) {
        try {
            const fichierHandle = await window.showSaveFilePicker({
                suggestedName: nomFichier,
                types: [{
                    description: "CSV",
                    accept: { "text/csv": [".csv"] }
                }]
            });
            const flux = await fichierHandle.createWritable();
            await flux.write(csvContent);
            await flux.close();
            alert("Fichier CSV enregistré.");
            return;
        }
        catch (erreur) {
            if (erreur && erreur.name !== "AbortError") {
                console.warn("Enregistrement fichier bloqué, fallback sur téléchargement.", erreur);
            }
        }
    }

    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const lien = document.createElement("a");
    lien.href = url;
    lien.download = nomFichier;
    lien.click();
    URL.revokeObjectURL(url);
    alert("Fichier CSV téléchargé dans votre navigateur.");
}

function afficherAliments(filtre=""){
    listeAliments.innerHTML="";

    const resultat = aliments.filter(aliment =>
        aliment.nom.toLowerCase().includes(filtre.toLowerCase())
    );

    resultat.forEach(aliment => {
        const div = document.createElement("div");
        div.className = "aliment";
        div.innerHTML = "<strong>" + aliment.nom + "</strong><br aria-hidden=\"true\">" + aliment.categorie + " • " + aliment.calories_100g + " kcal /100g";

        div.onclick = () => {
            document.querySelectorAll(".aliment").forEach(el =>
                el.classList.remove("aliment-selectionne")
            );

            div.classList.add("aliment-selectionne");
            alimentSelectionne = aliment;

            document.getElementById("selection").innerHTML = "Sélection : " + aliment.nom;
            document.getElementById("quantite").value = aliment.portion_defaut || 100;
        };

        listeAliments.appendChild(div);
    });
}

document.getElementById("recherche").addEventListener("input", function(){
    afficherAliments(this.value);
});

poidsInput.addEventListener("change", function(){
    if (!this.checkValidity()) {
        alert("Saisissez un poids compris entre 0 et 999,9 kg avec une seule décimale au maximum.");
        afficherRepas();
        return;
    }

    const poidsKg = this.value === "" ? null : this.valueAsNumber;
    historiqueRepas[dateSelectionnee].poidsKg = poidsKg;
    if (poidsKg !== null) {
        this.value = poidsKg.toFixed(1);
    }
    sauvegarderRepas();
    afficherHistorique();
});

    if(!alimentSelectionne){
        alert("Sélectionnez un aliment.");

    }

    let nom = alimentSelectionne.nom;
    let quantite = parseFloat(document.getElementById("quantite").value);
    let calories100g = alimentSelectionne.calories_100g;

    if(nom === "autreAliment"){
        const nouveauNom = prompt("Nom de l'aliment :", "");

        if(!nouveauNom){
            return;
        }

        nom = nouveauNom.trim();

        const nouveauxGrammes = prompt("Quantité (g) :", quantite);

        if(nouveauxGrammes === null || isNaN(nouveauxGrammes)){
            return;
        }

        quantite = parseFloat(nouveauxGrammes);

        const nouvellesKcal = prompt("Calories pour 100 g :", calories100g);

        if(nouvellesKcal === null || isNaN(nouvellesKcal)){
            return;
        }

        calories100g = parseFloat(nouvellesKcal);
    }

    const calories = (quantite * calories100g) / 100;
    const repasDuJour = getRepasDuJour();

    repasDuJour.push({
        nom: nom,
        quantite: quantite,
        calories: calories
    });

    setRepasDuJour(repasDuJour);
    afficherRepas();
}

function afficherRepas(){
    const zone = document.getElementById("repas");
    zone.innerHTML = "";

    const jour = historiqueRepas[dateSelectionnee];
    poidsInput.value = jour?.poidsKg ?? "";
    const repasDuJour = getRepasDuJour();
    let total = 0;

    repasDuJour.forEach((item,index) => {
        total += Number(item.calories) || 0;

        const ligne = document.createElement("div");
        ligne.className = "ligneRepas";

        ligne.innerHTML = `
        <div>
        <strong>${item.nom}</strong><br>
        ${item.quantite} g
        - ${(Number(item.calories) || 0).toFixed(0)} kcal
        </div>

        <button
        class="btnSupprimer"
        onclick="supprimer(${index})">
        ✕
        </button>
        `;

        zone.appendChild(ligne);
    });

    document.getElementById("total").innerHTML = total.toFixed(0) + " kcal";
    afficherHistorique();
}

function afficherHistorique(){
    const historiqueZone = document.getElementById("historiqueJours");
    const jours = getHistoriqueTrie();

    if (!jours.length) {
        historiqueZone.innerHTML = "Aucun repas enregistré.";
        return;
    }

    historiqueZone.innerHTML = jours
        .map(([dateJour, data]) => {
            const items = Array.isArray(data?.repas) ? data.repas : [];
            const totalJour = items.reduce((s, item) => s + (Number(item.calories) || 0), 0);
            const poidsJour = data?.poidsKg == null ? "" : ` • ${Number(data.poidsKg).toFixed(1)} kg`;
            const actif = dateJour === dateSelectionnee ? "<strong>•</strong> " : "";
            return `
                <div class="historiqueJour">
                    <div>${actif}${formaterDate(dateJour)}</div>
                    <div>${items.length} aliments • ${totalJour.toFixed(0)} kcal${poidsJour}</div>
                </div>
            `;
        })
        .join("");
}

function supprimer(index){
    const repasDuJour = getRepasDuJour();
    repasDuJour.splice(index, 1);
    setRepasDuJour(repasDuJour);
    afficherRepas();
}

function exporterRepasJSON(){
    const repasJour = getRepasDuJour();
    const donnees = {
        date: dateSelectionnee,
        repas: repasJour,
        total: repasJour.reduce((sum, item) => sum + (Number(item.calories) || 0), 0),
        poidsKg: historiqueRepas[dateSelectionnee]?.poidsKg ?? null
    };

    const blob = new Blob([JSON.stringify(donnees, null, 2)], { type: "application/json" });
    const lien = document.createElement("a");
    lien.href = URL.createObjectURL(blob);
    const date = new Date().toISOString().slice(0,10);
    lien.download = "Repas_" + date + ".json";
    lien.click();
    URL.revokeObjectURL(lien.href);
}

function importerRepasJSON(event){
    const fichier = event.target.files[0];

    if(!fichier){
        return;
    }

    const lecteur = new FileReader();

    lecteur.onload = function(e){
        try {
            const data = JSON.parse(e.target.result);

            if (data && typeof data === "object" && data.repasParJour) {
                historiqueRepas = normaliserHistorique(data.repasParJour);
            }
            else if (Array.isArray(data.repas)) {
                historiqueRepas = {
                    [dateSelectionnee]: { repas: data.repas, total: data.repas.reduce((s, item) => s + (Number(item.calories) || 0), 0) }
                };
            }
            else if (Array.isArray(data)) {
                historiqueRepas = {
                    [dateSelectionnee]: { repas: data, total: data.reduce((s, item) => s + (Number(item.calories) || 0), 0) }
                };
            }
            else {
                alert("Format JSON invalide.");
                return;
            }

            if (!historiqueRepas[dateSelectionnee]) {
                historiqueRepas[dateSelectionnee] = { repas: [], total: 0 };
            }

            sauvegarderRepas();
            afficherRepas();
            alert("Repas importé avec succès.");
        }
        catch(err){
            console.error(err);
            alert("Erreur de lecture du fichier JSON.");
        }
    };

    lecteur.readAsText(fichier);
}

window.addEventListener("pageshow", sauvegarderRepas);
document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") {
        sauvegarderRepas();
    }
});
window.addEventListener("beforeunload", sauvegarderRepas);

chargerRepas();
afficherAliments();
afficherRepas();
