<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cal_V5_261119-0827</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f2f2f7;margin:0;padding:12px;font-size:14px}.container{max-width:700px;margin:auto}h1{text-align:center;color:#007AFF;font-size:24px;margin:8px 0 16px}h2{margin:0 0 10px;font-size:18px}.card{background:white;padding:12px;margin-bottom:12px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,.08)}label{display:block;margin-top:8px;font-weight:600;font-size:13px}input{width:100%;box-sizing:border-box;padding:10px 11px;border:1px solid #ccc;border-radius:8px;font-size:14px}button{width:100%;padding:12px;margin-top:12px;border:0;border-radius:8px;font-size:14px;font-weight:bold;color:white;background:#007AFF}button:active{opacity:.8}#listeAliments{margin-top:10px;border-top:1px solid #eee;max-height:min(52vh,360px);overflow-y:auto;overflow-x:hidden;padding-right:6px;scroll-behavior:smooth}.aliment{padding:10px 8px;border-bottom:1px solid #eee;cursor:pointer;font-size:13px;line-height:1.35}.aliment:hover{background:#f7f9ff}.aliment-selectionne{background:#d6e9ff;border-radius:6px}.selection{margin-top:10px;color:#007AFF;font-weight:bold;font-size:13px}.ligneRepas{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:8px 0;font-size:13px}.btnSupprimer{width:auto;background:#ff3b30;margin:0;padding:6px 10px;font-size:12px}.total{text-align:center;font-size:22px;font-weight:bold;color:#34C759}.info{color:#666;font-size:12px;margin-top:8px}@media(max-width:480px){#listeAliments{max-height:40vh}.aliment{font-size:12.5px;padding:9px 6px}}
fieldset{border:0;margin:0;padding:0;min-width:0}.btnSauverAliments{width:auto;padding:6px 10px;font-size:12px}
</style>
</head>
<body>
<div class="container">
<h1>🍎 Cal_V5_261119-0827</h1>
<div class="card"><h2>Repas</h2><div id="total" class="total">0 kcal</div><div style="display:grid;gap:8px"><button onclick="exporterRepasJSON()">📤 Exporter repas JSON</button></div><input type="file" id="importRepas" accept=".json" onchange="importerRepasJSON(event)"><div id="repas"></div></div>
<fieldset id="gestionAliments" disabled>
<div class="card"><label>Recherche</label><input type="text" id="recherche" placeholder="Exemple : pomme"><button class="btnSauverAliments" onclick="sauvegarderAliments(true)">Sauvegarder les aliments</button><div id="selection" class="selection">Aucun aliment sélectionné</div><div id="listeAliments"></div><label>Quantité (g)</label><input type="number" id="quantite" value="100" min="1"><button onclick="ajouterAuRepas()">Ajouter au repas</button></div>
<div class="card"><label>Aliment personnalisé</label><input type="text" id="nomAlimentPerso" placeholder="Nom de l'aliment"><input type="text" id="categorieAlimentPerso" placeholder="Catégorie (ex. Fruit, Viande, Dessert)"><input type="number" id="kcalPerso" min="0" step="1" placeholder="kcal / 100g"><input type="number" id="glucidePerso" min="0" step="0.1" value="" placeholder="Glucides / 100g (g)"><input type="number" id="lipidePerso" min="0" step="0.1" value="" placeholder="Lipides / 100g (g)"><input type="number" id="proteinePerso" min="0" step="0.1" value="" placeholder="Protéines / 100g (g)"><button onclick="ajouterAlimentPerso()">Ajouter à la liste</button></div>
</fieldset>

</div>
<script>
function normaliserAliment(a){if(!a||typeof a!=="object")return a;const g=Number(a.glucide),l=Number(a.lipide),p=Number(a.proteine);return{...a,glucide:Number.isFinite(g)&&g>=0?g:10,lipide:Number.isFinite(l)&&l>=0?l:20,proteine:Number.isFinite(p)&&p>=0?p:30}}
function calculerMacros(a,q){q=Number(q)||0;return{glucide:(Number(a.glucide)||0)*q/100,lipide:(Number(a.lipide)||0)*q/100,proteine:(Number(a.proteine)||0)*q/100}}
let aliments=[],historiqueRepas={},dateSelectionnee=new Date().toISOString().slice(0,10),alimentSelectionne=null,dossierImportation=null;
const STORAGE_KEY="ali-ca-repas",FOODS_KEY="ali-ca-foods",CUSTOM_FOODS_KEY="ali-ca-custom-foods",BACKUP_KEY="ali-ca-onedrive-backup-",listeAliments=document.getElementById("listeAliments");
function trierAlimentsParNom(a,b){return String(a.nom||"").localeCompare(String(b.nom||""),"fr",{sensitivity:"base"})}
function sauvegarderAliments(confirmer=false){try{localStorage.setItem(FOODS_KEY,JSON.stringify(aliments));if(confirmer)alert("Liste des aliments sauvegardée dans ce navigateur.");return true}catch(e){console.error("Impossible de sauvegarder les aliments :",e);alert("Impossible de sauvegarder les aliments dans ce navigateur.");return false}}
async function chargerAliments(){try{const sauvegarde=localStorage.getItem(FOODS_KEY);let liste;if(sauvegarde!==null){liste=JSON.parse(sauvegarde)}else{const reponse=await fetch("aliments.json");if(!reponse.ok)throw Error("Fichier initial indisponible : "+reponse.status);liste=await reponse.json();const perso=localStorage.getItem(CUSTOM_FOODS_KEY);if(perso!==null){const anciens=JSON.parse(perso);if(!Array.isArray(anciens))throw Error("Liste personnalisée invalide");liste=liste.concat(anciens)}}if(!Array.isArray(liste)||!liste.every(a=>a&&typeof a==="object"&&typeof a.nom==="string"))throw Error("Liste des aliments invalide");aliments=liste.map(normaliserAliment).sort(trierAlimentsParNom);if(sauvegarde===null&&!sauvegarderAliments())return;afficherAliments(document.getElementById("recherche").value);document.getElementById("gestionAliments").disabled=false}catch(e){console.error("Impossible de charger les aliments :",e);alert("Impossible de charger la liste des aliments. Vérifiez le stockage du navigateur et la disponibilité du fichier aliments.json.")}}
function ajouterAlimentPerso(){const nomInput=document.getElementById("nomAlimentPerso"),categorieInput=document.getElementById("categorieAlimentPerso"),kcalInput=document.getElementById("kcalPerso"),glucideInput=document.getElementById("glucidePerso"),lipideInput=document.getElementById("lipidePerso"),proteineInput=document.getElementById("proteinePerso"),nom=nomInput.value.trim(),categorie=categorieInput.value.trim()||"Personnalisé",kcal=Number(kcalInput.value);if(!nom){alert("Saisis le nom de l'aliment.");return}if(!Number.isFinite(kcal)||kcal<0){alert("Saisis une valeur de kcal valide (> 0).");return}const a={id:Date.now(),nom,categorie,portion_defaut:100,unite:"g",calories_100g:kcal,glucide:Number(glucideInput.value)||10,lipide:Number(lipideInput.value)||20,proteine:Number(proteineInput.value)||30};aliments.push(a);aliments.sort(trierAlimentsParNom);sauvegarderAliments();alimentSelectionne=a;document.getElementById("selection").textContent="Sélection : "+nom;document.getElementById("quantite").value=100;[nomInput,categorieInput,kcalInput].forEach(i=>i.value="");glucideInput.value=10;lipideInput.value=20;proteineInput.value=30;document.getElementById("recherche").value="";afficherAliments("")}
function formaterDateHeure(d){const p=n=>String(n).padStart(2,"0");return `${String(d.getFullYear()).slice(-2)}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`}
function dateHeurePourSauvegarde(value){if(!value)return null;const ancien=typeof value==="string"&&value.match(/^(\d{2})-(\d{2})-(\d{2}) (\d{2})(\d{2})$/);if(ancien)return `${ancien[1]}${ancien[2]}${ancien[3]}-${ancien[4]}${ancien[5]}00`;if(typeof value==="string"&&/^\d{6}-\d{6}$/.test(value))return value;console.warn("Format de date d'aliment non reconnu :",value);return value}
function dateHeurePourAffichage(value){if(typeof value!=="string")return value;const m=value.match(/^(\d{2})(\d{2})(\d{2})-(\d{2})(\d{2})\d{2}$/);return m?`${m[1]}-${m[2]}-${m[3]} ${m[4]}${m[5]}`:value}
function normaliserHistorique(data){let jour;if(Array.isArray(data))jour={repas:data,total:data.reduce((s,i)=>s+(Number(i.calories)||0),0)};else{const v=data?.[dateSelectionnee];const repas=Array.isArray(v?.repas)?v.repas:Array.isArray(v)?v:[];jour={repas,total:repas.reduce((s,i)=>s+(Number(i.calories)||0),0)}}return{[dateSelectionnee]:jour}}
function readCookieValue(k){const m=document.cookie.match(new RegExp("(?:^|; )"+k+"=([^;]*)"));return m?decodeURIComponent(m[1]):null}
function sauvegarderRepas(){const j=historiqueRepas[dateSelectionnee]||{repas:[],total:0};historiqueRepas={[dateSelectionnee]:{repas:j.repas,total:j.total}};const payload=JSON.stringify(historiqueRepas);try{localStorage.setItem(STORAGE_KEY,payload);return true}catch(e){console.warn(e)}try{sessionStorage.setItem(STORAGE_KEY,payload);return true}catch(e){console.warn(e)}try{document.cookie=`${STORAGE_KEY}=${encodeURIComponent(payload)}; path=/; max-age=31536000; SameSite=Lax`}catch(e){console.warn(e)}window.__aliCaFallbackStorage=payload;return true}
function chargerRepas(){for(const lire of [()=>localStorage.getItem(STORAGE_KEY),()=>sessionStorage.getItem(STORAGE_KEY),()=>readCookieValue(STORAGE_KEY),()=>window.__aliCaFallbackStorage||null])try{const raw=lire();if(raw){historiqueRepas=normaliserHistorique(JSON.parse(raw));sauvegarderRepas();return}}catch(e){console.warn(e)}historiqueRepas={[dateSelectionnee]:{repas:[],total:0}}}
function getRepasDuJour(){const j=historiqueRepas[dateSelectionnee]||{repas:[]};return Array.isArray(j.repas)?j.repas:[]}
function setRepasDuJour(r){historiqueRepas[dateSelectionnee]={repas:r,total:r.reduce((s,i)=>s+(Number(i.calories)||0),0)};sauvegarderRepas()}
function escapeCSV(v){const t=String(v??"");return /[";\r\n]/.test(t)?`"${t.replace(/"/g,'""')}"`:t}
function getCsvContent(){const rows=[["date","date_heure","aliment","quantite_g","calories_kcal","glucides_g","lipides_g","proteines_g"]],repas=getRepasDuJour(),[y,m,day]=dateSelectionnee.split("-"),dateCSV=`${day}/${m}/${y.slice(-2)}`;repas.forEach(i=>rows.push([dateCSV,dateHeurePourSauvegarde(i.dateHeure)||"",i.nom,Number(i.quantite)||0,Number(i.calories)||0,Number(i.glucide)||0,Number(i.lipide)||0,Number(i.proteine)||0]));return "\uFEFF" + rows.map(row => row.map(escapeCSV).join(";")).join("\r\n")}
function getCsvFileName(){const d=new Date(),p=n=>String(n).padStart(2,"0");return`histo_${String(d.getFullYear()).slice(-2)}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.csv`}
function getJsonFileName(){const d=new Date(),p=n=>String(n).padStart(2,"0");return`repas_${String(d.getFullYear()).slice(-2)}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.json`}
async function ouvrirDossierImportation(){if(dossierImportation)return dossierImportation;if(!window.showDirectoryPicker)throw Error("Sélection du dossier non prise en charge par ce navigateur");const parent=await window.showDirectoryPicker({mode:"readwrite"});dossierImportation=await parent.getDirectoryHandle("Importations",{create:true});return dossierImportation}
async function enregistrerDansDossierImportation(nom,contenu){try{const d=await ouvrirDossierImportation(),h=await d.getFileHandle(nom,{create:true}),w=await h.createWritable();await w.write(contenu);await w.close();return true}catch(e){if(e?.name!=="AbortError")console.warn("Impossible d'écrire dans OneDrive\\Importations",e);return false}}
function donneesJSONDuJour(){const repas=getRepasDuJour();return{date:dateSelectionnee,repas:repas.map(i=>({nom:i.nom,quantite:Number(i.quantite)||0,calories:Number(i.calories)||0,glucide:Number(i.glucide)||0,lipide:Number(i.lipide)||0,proteine:Number(i.proteine)||0,dateHeure:dateHeurePourSauvegarde(i.dateHeure)})),total:repas.reduce((s,i)=>s+(Number(i.calories)||0),0)}}
function marquerSauvegardeDuJour(){try{localStorage.setItem(BACKUP_KEY+dateSelectionnee,"1")}catch(e){console.warn(e)}}
async function demanderSauvegardeDuJour(){let dejaSauve=false;try{dejaSauve=localStorage.getItem(BACKUP_KEY+dateSelectionnee)==="1"}catch(e){}if(dejaSauve)return;if(!confirm("Aucune sauvegarde du jour n'a encore été enregistrée dans OneDrive\\Importations. Voulez-vous sauvegarder le repas maintenant ?"))return;const nom=getJsonFileName(),ok=await enregistrerDansDossierImportation(nom,JSON.stringify(donneesJSONDuJour(),null,2));if(ok){marquerSauvegardeDuJour();alert("Sauvegarde du jour enregistrée dans OneDrive\\Importations.")}else alert("Sauvegarde non effectuée. Vérifiez le dossier OneDrive sélectionné et réessayez.")}
async function sauvegarderCSV(){const content=getCsvContent(),nom=getCsvFileName();if(await enregistrerDansDossierImportation(nom,content)){alert("Fichier CSV enregistré dans le dossier Importations.");return}const blob=new Blob([content],{type:"text/csv;charset=utf-8;"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=nom;a.click();URL.revokeObjectURL(url);alert("Fichier CSV téléchargé dans votre navigateur.")}
function normaliserTexteRecherche(texte){return String(texte||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function afficherAliments(f=""){listeAliments.innerHTML="";aliments.filter(a=>normaliserTexteRecherche(a.nom).includes(normaliserTexteRecherche(f))).sort(trierAlimentsParNom).forEach(a=>{const d=document.createElement("div");d.className="aliment";d.innerHTML=`<strong>${a.nom}</strong><br>${a.categorie} • ${a.calories_100g} kcal /100g • G ${Number(a.glucide||0).toFixed(0)} • L ${Number(a.lipide||0).toFixed(0)} • P ${Number(a.proteine||0).toFixed(0)}`;d.onclick=()=>{document.querySelectorAll(".aliment").forEach(e=>e.classList.remove("aliment-selectionne"));d.classList.add("aliment-selectionne");alimentSelectionne=a;document.getElementById("selection").textContent="Sélection : "+a.nom;document.getElementById("quantite").value=a.portion_defaut||100};if(alimentSelectionne?.id===a.id)d.classList.add("aliment-selectionne");listeAliments.appendChild(d)})}
function reinitialiserSelectionAliment(){document.getElementById("recherche").value="";afficherAliments("");if(alimentSelectionne){document.getElementById("selection").textContent="Sélection : "+alimentSelectionne.nom;document.getElementById("quantite").value=alimentSelectionne.portion_defaut||100}}
document.getElementById("recherche").addEventListener("input",function(){afficherAliments(this.value)});
async function ajouterAuRepas(){if(!alimentSelectionne){alert("Sélectionnez un aliment.");return}const q=parseFloat(document.getElementById("quantite").value),a=alimentSelectionne,m=calculerMacros(a,q),r=getRepasDuJour();r.push({nom:a.nom,dateHeure:formaterDateHeure(new Date()),quantite:q,calories:q*a.calories_100g/100,glucide:m.glucide,lipide:m.lipide,proteine:m.proteine});setRepasDuJour(r);reinitialiserSelectionAliment();afficherRepas()}
function afficherRepas(){const z=document.getElementById("repas");z.innerHTML="";let total=0;getRepasDuJour().forEach((i,n)=>{total+=Number(i.calories)||0;const row=document.createElement("div");row.className="ligneRepas";row.innerHTML=`<div>${i.dateHeure?`<div class="info">${dateHeurePourAffichage(i.dateHeure)}</div>`:""}<strong>${i.nom}</strong><br>${Number(i.quantite)||0} g - ${(Number(i.calories)||0).toFixed(0)} kcal<div class="info">G ${(Number(i.glucide)||0).toFixed(0)} • L ${(Number(i.lipide)||0).toFixed(0)} • P ${(Number(i.proteine)||0).toFixed(0)}</div></div><button class="btnSupprimer" onclick="supprimer(${n})">✕</button>`;z.appendChild(row)});document.getElementById("total").textContent=total.toFixed(0)+" kcal"}
function supprimer(i){const r=getRepasDuJour();r.splice(i,1);setRepasDuJour(r);afficherRepas()}
async function exporterRepasJSON(){const content=JSON.stringify(donneesJSONDuJour(),null,2),nom=getJsonFileName();if(await enregistrerDansDossierImportation(nom,content)){marquerSauvegardeDuJour();alert("Fichier JSON enregistré dans le dossier Importations.");return}const blob=new Blob([content],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=nom;a.click();URL.revokeObjectURL(url);alert("Fichier JSON téléchargé dans votre navigateur; il n'a pas été enregistré dans OneDrive.")}
function importerRepasJSON(event){const f=event.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=e=>{try{const data=JSON.parse(e.target.result);let repas;if(data?.repasParJour){const j=data.repasParJour[dateSelectionnee];repas=Array.isArray(j?.repas)?j.repas:Array.isArray(j)?j:[]}else if(Array.isArray(data.repas)){repas=data.repas}else if(Array.isArray(data)){repas=data}else{alert("Format JSON invalide.");return}historiqueRepas={[dateSelectionnee]:{repas:repas.map(i=>({...i,quantite:Number(i.quantite)||0,calories:Number(i.calories)||0,glucide:Number(i.glucide)||0,lipide:Number(i.lipide)||0,proteine:Number(i.proteine)||0})),total:repas.reduce((s,i)=>s+(Number(i.calories)||0),0)}};sauvegarderRepas();afficherRepas();alert("Repas importé avec succès.")}catch(err){console.error(err);alert("Erreur de lecture du fichier JSON.")}};reader.readAsText(f)}
window.addEventListener("pageshow",sauvegarderRepas);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")sauvegarderRepas()});window.addEventListener("beforeunload",sauvegarderRepas);chargerRepas();chargerAliments();afficherRepas();
</script>
