function trierAlimentsParNom(a,b){return String(a.nom||"").localeCompare(String(b.nom||""),"fr",{sensitivity:"base"})}

function ajouterAlimentPerso(){const nomInput=document.getElementById("nomAlimentPerso"),categorieInput=document.getElementById("categorieAlimentPerso"),kcalInput=document.getElementById("kcalPerso"),glucideInput=document.getElementById("glucidePerso"),lipideInput=document.getElementById("lipidePerso"),proteineInput=document.getElementById("proteinePerso"),nom=nomInput.value.trim(),categorie=categorieInput.value.trim()||"Personnalisé",kcal=Number(kcalInput.value);if(!nom){alert("Saisis le nom de l'aliment.");return}if(!Number.isFinite(kcal)||kcal<0){alert("Saisis une valeur de kcal valide (> 0).");return}const a={id:Date.now(),nom,categorie,portion_defaut:100,unite:"g",calories_100g:kcal,glucide:Number(glucideInput.value)||10,lipide:Number(lipideInput.value)||20,proteine:Number(proteineInput.value)||30};aliments.push(a);aliments.sort(trierAlimentsParNom);sauvegarderAlimentsPerso();alimentSelectionne=a;document.getElementById("selection").textContent="Sélection : "+nom;document.getElementById("quantite").value=100;[nomInput,categorieInput,kcalInput].forEach(i=>i.value="");glucideInput.value=10;lipideInput.value=20;proteineInput.value=30;document.getElementById("recherche").value="";afficherAliments("")}

function formaterDateHeure(d){const p=n=>String(n).padStart(2,"0");return `${String(d.getFullYear()).slice(-2)}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}${p(d.getMinutes())}`}

function sauvegarderRepas(){const j=historiqueRepas[dateSelectionnee]||{repas:[],total:0,poidsKg:null};historiqueRepas={[dateSelectionnee]:j};const payload=JSON.stringify(historiqueRepas);try{localStorage.setItem(STORAGE_KEY,payload);return true}catch(e){console.warn(e)}try{sessionStorage.setItem(STORAGE_KEY,payload);return true}catch(e){console.warn(e)}try{document.cookie=`${STORAGE_KEY}=${encodeURIComponent(payload)}; path=/; max-age=31536000; SameSite=Lax`}catch(e){console.warn(e)}window.__aliCaFallbackStorage=payload;return true}

function getCsvFileName(){const d=new Date(),p=n=>String(n).padStart(2,"0");return`histo_${String(d.getFullYear()).slice(-2)}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getSeconds())}.csv`}

async function ouvrirDossierImportation(){if(dossierImportation)return dossierImportation;if(!window.showDirectoryPicker)throw Error("Sélection du dossier non prise en charge par ce navigateur");const parent=await window.showDirectoryPicker({mode:"readwrite"});dossierImportation=await parent.getDirectoryHandle("Importations",{create:true});return dossierImportation}

function afficherAliments(f=""){listeAliments.innerHTML="";aliments.filter(a=>(a.nom||"").toLowerCase().includes(f.toLowerCase())).sort(trierAlimentsParNom).forEach(a=>{const d=document.createElement("div");d.className="aliment";d.innerHTML=`<strong>${a.nom}</strong><br>${a.categorie} • ${a.calories_100g} kcal /100g • G ${Number(a.glucide||0).toFixed(0)} • L ${Number(a.lipide||0).toFixed(0)} • P ${Number(a.proteine||0).toFixed(0)}`;d.onclick=()=>{document.querySelectorAll(".aliment").forEach(e=>e.classList.remove("aliment-selectionne"));d.classList.add("aliment-selectionne");alimentSelectionne=a;document.getElementById("selection").textContent="Sélection : "+a.nom;document.getElementById("quantite").value=a.portion_defaut||100};if(alimentSelectionne?.id===a.id)d.classList.add("aliment-selectionne");listeAliments.appendChild(d)})}
